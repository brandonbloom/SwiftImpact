name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: macos-26
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: swift package docs --hosting-base-path /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/plugins/Docs/outputs/SwiftImpact.doccarchive
      - id: deployment
        uses: actions/deploy-pages@v4
